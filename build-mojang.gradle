buildscript {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		gradlePluginPortal()
	}
	dependencies {
		classpath 'net.fabricmc:fabric-loom:1.17-SNAPSHOT'
	}
}

plugins {
	id 'maven-publish'
}

apply plugin: 'net.fabricmc.fabric-loom'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(project.java_version)
	}
}

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

// ── Exclude non-Mojang entrypoints ──
sourceSets {
	main {
		java {
			exclude 'pl/kosma/mapchameleon/MapChameleonMod.java'
			exclude 'pl/kosma/mapchameleon/MapChameleonMod_Legacy.java'
			exclude 'pl/kosma/mapchameleon/mixins/MixinPlayerManager.java'
			exclude 'pl/kosma/mapchameleon/mixins/MixinPlayerManager_Legacy.java'
		}
	}
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// MC 26.x: Mojang dropped obfuscation — no mappings needed
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	def entrypoint = "pl.kosma.mapchameleon.MapChameleonMod_Mojang"
	def minecraftDepends = ">=26.0"
	def loaderDepends = ">=0.19.0"
	def apiDepends = ">=0.155.0"
	def mixinConfig = "map-chameleon.mixins_mojang.json"

	inputs.property "version", project.version
	inputs.property "entrypoint", entrypoint
	inputs.property "minecraft_depends", minecraftDepends
	inputs.property "fabricloader_depends", loaderDepends
	inputs.property "fabricapi_depends", apiDepends
	inputs.property "mixin_config", mixinConfig

	filesMatching("fabric.mod.json") {
		expand(
			"version": project.version,
			"entrypoint": entrypoint,
			"minecraft_depends": minecraftDepends,
			"fabricloader_depends": loaderDepends,
			"fabricapi_depends": apiDepends,
			"mixin_config": mixinConfig
		)
	}
}

tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

// MC 26.x has no obfuscation → no remapJar; name jar directly
jar {
	archiveFileName = "${project.archives_base_name}-${project.mod_version}+mc26.2.jar"
	from "LICENSE"
}
