name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: "MC ${{ matrix.label }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── MC 1.20 ~ 1.20.4（旧网络 API，Yarn 映射）──
          - label: "1.20-1.20.4"
            minecraft_version: "1.20.4"
            yarn_mappings: "1.20.4+build.3"
            fabric_version: "0.96.11+1.20.4"
            java_version: 21

          # ── MC 1.20.5 ~ 1.21.x（新网络 API，Yarn 映射）──
          - label: "1.20.5-1.21.11"
            minecraft_version: "1.20.5"
            yarn_mappings: "1.20.5+build.1"
            fabric_version: "0.97.8+1.20.5"
            java_version: 21

          # ── MC 26.2（Mojang 官方映射，无混淆）──
          - label: "26.2"
            minecraft_version: "26.2"
            fabric_version: "0.155.2+26.2"
            loader_version: "0.19.3"
            java_version: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java_version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # ──────────── Yarn 构建（MC 1.20 ~ 1.21.x）────────────
      - name: Build (Yarn mappings)
        if: matrix.label != '26.2'
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon \
            -Pminecraft_version=${{ matrix.minecraft_version }} \
            -Pyarn_mappings=${{ matrix.yarn_mappings }} \
            -Pfabric_version=${{ matrix.fabric_version }} \
            -Pjava_version=${{ matrix.java_version }}

      # ──────────── Mojang 构建（MC 26.x，-b 指定构建文件）────────────
      - name: Build (Mojang mappings)
        if: matrix.label == '26.2'
        run: |
          sed -i 's|gradle-8.10.2-bin.zip|gradle-9.5.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew -b build-mojang.gradle build --no-daemon \
            -Pminecraft_version=${{ matrix.minecraft_version }} \
            -Pfabric_version=${{ matrix.fabric_version }} \
            -Ploader_version=${{ matrix.loader_version }} \
            -Pjava_version=${{ matrix.java_version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: map-chameleon-mc${{ matrix.label }}
          path: build/libs/*.jar
          if-no-files-found: error

  # ── 仅 tag(v*) 或手动触发时创建 GitHub Release ──
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: map-chameleon-*
          merge-multiple: false
          path: jars

      - name: Flatten & list jars
        run: |
          mkdir -p release
          find jars -name "*.jar" -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Map Chameleon ${{ github.ref_name }}"
          files: release/*.jar
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
